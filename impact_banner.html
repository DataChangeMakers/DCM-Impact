<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data ChangeMakers — Impact Banner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: #f5f4f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1rem;
}

.banner {
  width: 100%;
  max-width: 1200px;
  height: 400px;
  background: #ffffff;
  border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.07);
  overflow: hidden;
  display: grid;
  grid-template-columns: 160px 1fr 1fr 1fr 220px;
  grid-template-rows: 1fr;
}

.panel-kpis {
  background: #0F6E56;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.panel-kpis .logo { height: 52px; width: auto; margin-bottom: 20px; }
.kpi-item { margin-bottom: 4px; }
.kpi-val { font-size: 28px; font-weight: 700; color: #ffffff; line-height: 1; }
.kpi-label { font-size: 10px; color: rgba(255,255,255,0.65); font-weight: 500; letter-spacing: 0.04em; margin-top: 1px; }
.kpi-divider { width: 24px; height: 1px; background: rgba(255,255,255,0.2); margin: 8px 0; }
.banner-tagline { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-top: auto; }

.panel-chart {
  padding: 20px;
  border-right: 1px solid rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
}
.panel-title { font-size: 12px; font-weight: 700; color: #141412; margin-bottom: 2px; }
.panel-sub { font-size: 10px; color: #b4b2a9; margin-bottom: 12px; }
.chart-wrap { flex: 1; position: relative; min-height: 0; }

.panel-survey {
  padding: 20px;
  border-right: 1px solid rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.survey-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.stab {
  font-family: inherit; font-size: 10px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px;
  border: 1px solid rgba(0,0,0,0.1); background: transparent;
  cursor: pointer; color: #888780;
}
.stab.active { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.survey-content { flex: 1; overflow: hidden; }

.panel-quotes {
  background: #f9f8f6;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}
.quote-mark { font-size: 32px; line-height: 1; color: #1D9E75; font-weight: 700; margin-bottom: 4px; }
.quote-text {
  font-size: 12px; color: #2c2c2a; line-height: 1.6;
  font-style: italic; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 7;
  -webkit-box-orient: vertical; overflow: hidden;
}
.quote-org { font-size: 10px; color: #b4b2a9; font-weight: 600; margin-top: 10px; }
.quote-dots { display: flex; gap: 5px; margin-top: 10px; }
.qdot { width: 6px; height: 6px; border-radius: 50%; background: #d3d1c7; cursor: pointer; transition: background 0.2s; }
.qdot.active { background: #1D9E75; }

.action-bar {
  width: 100%;
  max-width: 1200px;
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 6px;
}
.action-btn {
  font-family: inherit; font-size: 10px; font-weight: 500;
  padding: 4px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(0,0,0,0.08); background: transparent;
  color: #b4b2a9; display: flex; align-items: center; gap: 4px;
  transition: all 0.15s;
}
.action-btn:hover { background: #fff; color: #888780; border-color: rgba(0,0,0,0.15); }
.action-btn.green { background: transparent; color: #b4b2a9; border-color: rgba(0,0,0,0.08); }
.action-btn.green:hover { background: #fff; color: #1D9E75; border-color: #1D9E75; }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.loading { display: flex; align-items: center; justify-content: center; height: 400px; color: #888780; font-size: 13px; gap: 10px; }
.spinner { width: 20px; height: 20px; border: 2px solid #e0deda; border-top-color: #1D9E75; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Loading impact data...
</div>

<div class="banner" id="banner" style="display:none;">

  <div class="panel-kpis">
    <div>
      <img src="https://static.wixstatic.com/media/2608ce_4ffd1217cfad49bb950c7e852ea7dbc0~mv2.png/v1/crop/x_0,y_84,w_1280,h_857/fill/w_133,h_89,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/FullLogo_Transparent.png" alt="DCM" class="logo">
      <div class="kpi-item">
        <div class="kpi-val" id="b-hours">—</div>
        <div class="kpi-label">Volunteer hours</div>
      </div>
      <div class="kpi-divider"></div>
      <div class="kpi-item">
        <div class="kpi-val" id="b-vols">—</div>
        <div class="kpi-label">Volunteers</div>
      </div>
      <div class="kpi-divider"></div>
      <div class="kpi-item">
        <div class="kpi-val" id="b-orgs">—</div>
        <div class="kpi-label">Nonprofits served</div>
      </div>
      <div class="kpi-divider"></div>
      <div class="kpi-item">
        <div class="kpi-val" id="b-submissions">—</div>
        <div class="kpi-label">Submissions</div>
      </div>
    </div>
  </div>

  <div class="panel-chart">
    <div class="panel-title">Hours by organisation</div>
    <div class="panel-sub">data visualisation projects</div>
    <div class="chart-wrap">
      <canvas id="b-hoursChart"></canvas>
    </div>
  </div>

  <div class="panel-survey">
    <div class="panel-title" style="margin-bottom:8px;">Organisation impact</div>
    <div class="survey-tabs" id="b-tabs" style="margin-bottom:6px;"></div>
    <div class="survey-content" id="b-survey"></div>
  </div>

  <div class="panel-survey">
    <div class="panel-title" style="margin-bottom:8px;">Volunteer feedback</div>
    <div class="survey-content" id="b-vol-ratings"></div>
  </div>

  <div class="panel-quotes">
    <div>
      <div class="quote-mark">"</div>
      <div class="quote-text" id="b-quote-text"></div>
      <div class="quote-org" id="b-quote-org"></div>
    </div>
    <div class="quote-dots" id="b-dots"></div>
  </div>

</div>

<div class="action-bar">
  <button class="action-btn" id="refresh-btn" onclick="refreshData()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    Refresh data
  </button>
  <button class="action-btn green" id="export-btn" onclick="exportPNG()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export PNG
  </button>
</div>

<script>
const API_KEY   = 'AIzaSyAtOXeiYk4A9KwEnj4LY3VB_ypJ8O69DlQ';
const SHEET1_ID = '1bDquzEfAkV959pBQXG1zofloY5ZTEFQZaSfJSdS7StA';
const SHEET1_TAB = 'Project Impact';
const SHEET2_ID = '14jOgDE-a7-I7Rns9zERGTcA2ounblIdli2b5v-sWYSg';
const SHEET2_TAB = 'All Submissions';
const SHEET3_ID = '1-fRkcHIc3-Md5hb8xaz2t4LarAGgLyR_jJuebgwVjCk';
const SHEET3_TAB = 'Feedback';

// ── FILTER: charity names to exclude (case-insensitive) ──
const EXCLUDED_CHARITIES = ['noise solution'];

const FB = { PROJECT:2, OVERALL:7, CHARITY_Q:8, DATA:9, SUPPORT:10, LIVE:11, ENJOYED:12 };

const COL = {
  CHARITY:3, TYPE:4, VOLS_PROJECT:5, HOURS_PROJECT:6, STUDENTS:12, GRAND_TOTAL:14,
  PRE_DATA:15, POST_DATA:16, PRE_LITERACY:17, POST_LITERACY:18,
  PRE_TOOLS:19, POST_SUPPORT:20, PRE_IMPACT:21, POST_IMPACT:22,
  PRE_DECISIONS:23, POST_DECISIONS:24,
  OVERALL_SAT:33, QUOTES:35,
};

function v(row, col) { return row[col-1] !== undefined ? String(row[col-1]).trim() : ''; }
function n(row, col) { return parseFloat(v(row, col).replace(/[$,]/g,'')) || 0; }

// Returns true if the charity name should be excluded
function isExcluded(name) {
  const lower = name.replace(/\s*\(.*?\)/g,'').trim().toLowerCase();
  return EXCLUDED_CHARITIES.some(ex => lower.includes(ex));
}

async function fetchSheet(id, tab, skip = 1) {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(tab)}?key=${API_KEY}`);
  const json = await res.json();
  return (json.values || []).slice(skip).filter(r => r.some(c => String(c).trim()));
}

let bSurveyData = {};
let bQuotes = [];
let bQuoteIdx = 0;
let hoursChart = null;

async function refreshData() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 0.7s linear infinite"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg> Refreshing...';
  if (hoursChart) { hoursChart.destroy(); hoursChart = null; }
  document.getElementById('banner').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';
  await init();
  btn.disabled = false;
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Refresh';
}

async function exportPNG() {
  const btn = document.getElementById('export-btn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 0.7s linear infinite"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg> Exporting...';
  try {
    const el = document.getElementById('banner');
    const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
    const link = document.createElement('a');
    link.download = `dcm-impact-banner-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err) {
    alert('Export failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PNG';
  }
}

async function init() {
  try {
    const [rows1, rows2, rows3] = await Promise.all([
      fetchSheet(SHEET1_ID, SHEET1_TAB, 1),
      fetchSheet(SHEET2_ID, SHEET2_TAB, 1),
      fetchSheet(SHEET3_ID, SHEET3_TAB, 1),
    ]);

    // ── Apply filter: exclude Noise Solution from project rows ──
    const projects = rows1
      .filter(r => v(r, COL.CHARITY).length > 1)
      .filter(r => !isExcluded(v(r, COL.CHARITY)));

    // KPIs
    const totalHours = projects.reduce((s, r) => s + (n(r, COL.GRAND_TOTAL) || n(r, COL.HOURS_PROJECT)), 0);
    const totalVols  = projects.reduce((s, r) => s + (n(r, COL.VOLS_PROJECT) || 0), 0);
    const uniqueOrgs = new Set(projects.map(r => v(r, COL.CHARITY).replace(/\s*\(.*?\)/g,'').trim().toLowerCase())).size;

    document.getElementById('b-hours').textContent = totalHours.toLocaleString();
    document.getElementById('b-vols').textContent = totalVols;
    document.getElementById('b-orgs').textContent = uniqueOrgs;
    document.getElementById('b-submissions').textContent = rows2.length;

    // Hours chart — viz projects only
    const orgMap = {};
    projects.forEach(r => {
      const type = v(r, COL.TYPE).toLowerCase();
      if (!type.includes('visuali')) return;
      const name = v(r, COL.CHARITY).replace(/\s*\(.*?\)/g,'').replace(/[Cc]ollorado/g,'Colorado').trim();
      const hrs = n(r, COL.GRAND_TOTAL) || n(r, COL.HOURS_PROJECT);
      orgMap[name] = (orgMap[name] || 0) + hrs;
    });
    const orgLabels = Object.keys(orgMap);
    const orgVals   = Object.values(orgMap);

    hoursChart = new Chart(document.getElementById('b-hoursChart'), {
      type: 'bar',
      data: {
        labels: orgLabels.map(l => l.length > 10 ? l.slice(0,9)+'…' : l),
        datasets: [{ data: orgVals, backgroundColor: '#1D9E75', borderRadius: 4, borderSkipped: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.raw.toLocaleString() + ' hrs' } } },
        scales: {
          x: { ticks: { font: { size: 9 }, maxRotation: 40, autoSkip: false }, grid: { display: false } },
          y: { ticks: { font: { size: 9 } }, grid: { color: 'rgba(0,0,0,0.04)' } }
        }
      }
    });

    // Survey data
    const bPostQuestions = [
      { key:'data',      tab:'Data',      questions:[
        { col: COL.POST_DATA,     label: 'More confident discussing data' },
        { col: COL.POST_SUPPORT,  label: 'DCM data support was valuable' },
      ]},
      { key:'literacy',  tab:'Literacy',  questions:[
        { col: COL.POST_LITERACY, label: 'Improved data literacy' },
      ]},
      { key:'impact',    tab:'Impact',    questions:[
        { col: COL.POST_IMPACT,   label: 'Increased confidence with funders' },
      ]},
      { key:'decisions', tab:'Decisions', questions:[
        { col: COL.POST_DECISIONS, label: 'Better decisions using data' },
      ]},
    ];
    bSurveyData = {};
    bPostQuestions.forEach(cat => {
      const questionsWithVals = cat.questions.map(q => {
        const vals = [];
        projects.forEach(r => { const val = n(r, q.col); if (val) vals.push(val); });
        return { label: q.label, vals };
      });
      bSurveyData[cat.key] = { tab: cat.tab, questions: questionsWithVals };
    });
    bRenderOrgImpact('data');

    // Volunteer feedback — filter out Noise Solution responses
    const filteredFeedback = rows3.filter(r => {
      const project = r[FB.PROJECT-1] ? String(r[FB.PROJECT-1]).trim().toLowerCase() : '';
      return !EXCLUDED_CHARITIES.some(ex => project.includes(ex));
    });
    bRenderVolFeedback(filteredFeedback);

    // Quotes
    bQuotes = projects.map(r => ({
      text: v(r, COL.QUOTES),
      org: v(r, COL.CHARITY).replace(/\s*\(.*?\)/g,'').trim()
    })).filter(q => q.text.length > 20);
    renderQuote(0);

    setInterval(() => {
      bQuoteIdx = (bQuoteIdx + 1) % bQuotes.length;
      renderQuote(bQuoteIdx);
    }, 5000);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('banner').style.display = 'grid';

  } catch(err) {
    document.getElementById('loading').innerHTML = `<span style="color:#993c1d;">Failed to load: ${err.message}</span>`;
  }
}

function bMakeStars(val, color) {
  const full = Math.floor(val);
  return Array.from({length:5}, (_,i) =>
    `<span style="font-size:12px;color:${i<full?color:'#d3d1c7'}">★</span>`
  ).join('');
}

function bRenderOrgImpact(activeKey) {
  const keys = Object.keys(bSurveyData);
  const key = activeKey || keys[0];
  const tabsEl = document.getElementById('b-tabs');
  if (!tabsEl) return;

  tabsEl.innerHTML = keys.map(k =>
    `<button class="stab ${k===key?'active':''}" onclick="bRenderOrgImpact('${k}')">${bSurveyData[k].tab}</button>`
  ).join('');

  const cat = bSurveyData[key];
  const el = document.getElementById('b-survey');
  if (!cat || !cat.questions.some(q => q.vals.length > 0)) {
    el.innerHTML = '<div style="font-size:11px;color:#b4b2a9;padding-top:6px;">No post-project survey data yet.</div>';
    return;
  }
  el.innerHTML = '<div style="font-size:10px;color:#b4b2a9;margin-bottom:8px;">Average post-project scores (1–5)</div>' +
    cat.questions.map(q => {
      if (!q.vals.length) return '';
      const avg = q.vals.reduce((a,b)=>a+b,0)/q.vals.length;
      const rounded = Math.round(avg*10)/10;
      const display = rounded%1===0 ? Math.round(rounded) : rounded.toFixed(1);
      return `<div style="margin-bottom:8px;">
        <div style="font-size:10px;color:#888780;margin-bottom:3px;line-height:1.3;">${q.label}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div>${bMakeStars(avg,'#1d9e75')}</div>
          <div style="font-size:11px;font-weight:600;color:#1d9e75;">${display}/5</div>
          <div style="font-size:9px;color:#b4b2a9;">(${q.vals.length})</div>
        </div>
      </div>`;
    }).join('');
}

function bRenderVolFeedback(rows3) {
  const fbRows = (rows3 || []).filter(r => {
    const val = r[FB.OVERALL-1] ? parseFloat(String(r[FB.OVERALL-1]).replace(/[$,]/g,'')) : 0;
    return val > 0;
  });
  const el = document.getElementById('b-vol-ratings');
  if (!el) return;
  if (!fbRows.length) { el.innerHTML = '<div style="font-size:11px;color:#b4b2a9;padding-top:6px;">No feedback yet.</div>'; return; }

  const ratingKeys = [
    { col: FB.OVERALL,   label: 'Overall experience' },
    { col: FB.CHARITY_Q, label: 'Charity choice' },
    { col: FB.DATA,      label: 'Data & instructions' },
    { col: FB.SUPPORT,   label: 'DCM support' },
    { col: FB.LIVE,      label: 'Live event format' },
  ];
  const nb = (row, col) => { const val = parseFloat(String(row[col-1]||'').replace(/[$,]/g,'')); return isNaN(val)?null:val; };

  el.innerHTML = `<div style="font-size:10px;color:#b4b2a9;margin-bottom:8px;">${fbRows.length} responses</div>` +
    ratingKeys.map(({ col, label }) => {
      const vals = fbRows.map(r => nb(r,col)).filter(x => x > 0);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      const rounded = Math.round(avg*10)/10;
      const display = rounded%1===0 ? Math.round(rounded) : rounded.toFixed(1);
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <div style="font-size:10px;color:#888780;width:100px;flex-shrink:0;">${label}</div>
        <div>${bMakeStars(avg,'#ef9f27')}</div>
        <div style="font-size:11px;font-weight:600;color:#ef9f27;">${display}/5</div>
      </div>`;
    }).join('');
}

function renderQuote(idx) {
  const q = bQuotes[idx];
  if (!q) return;
  const short = q.text.length > 200 ? q.text.slice(0, 197) + '…' : q.text;
  document.getElementById('b-quote-text').textContent = short;
  document.getElementById('b-quote-org').textContent = q.org;
  document.getElementById('b-dots').innerHTML = bQuotes.map((_, i) =>
    `<div class="qdot ${i===idx?'active':''}" onclick="bQuoteIdx=${i};renderQuote(${i})"></div>`
  ).join('');
}

init();
</script>
</body>
</html>
